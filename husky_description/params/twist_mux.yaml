/${TF_PREFIX}/twist_mux:
  ros__parameters:
    # Jazzy defaults to stamped twists, but Husky's existing command sources
    # still publish geometry_msgs/msg/Twist.
    use_stamped: false
    topics:
      keyboard:
        topic: keyboard
        timeout: 2.0
        priority: 3
      priority_twist:
        topic: priority_twist
        timeout: 2.0
        priority: 2
      twist:
        topic: twist
        timeout: 2.0
        priority: 1
    locks:
      e_stop:
        topic: e_stop
        timeout: 0.0
        priority: 255
