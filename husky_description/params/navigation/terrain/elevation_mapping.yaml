# ANYbotics elevation_mapping - baseline outdoor (robot-centric, local map)
# Param names: see ANYbotics elevation_mapping docs/issues. :contentReference[oaicite:2]{index=2}

# --- Frames ---
# In outdoor ti consiglio ODOM per stabilità (no salti GPS).
map_frame_id: "$(arg prefix)$(arg odom_frame)"
robot_base_frame_id: "$(arg prefix)$(arg base_frame)"
sensor_frame_id: "$(arg prefix)lidar"   # meglio: il frame reale del lidar se ce l'hai
track_point_frame_id: "$(arg prefix)$(arg base_frame)"
track_point_x: 0.0
track_point_y: 0.0
track_point_z: 0.0


robot_pose_with_covariance_topic: "/$(arg prefix)pose_with_covariance"

# --- Map geometry (coerente con la tua local_costmap outdoor: 60x60 @ 0.10) ---
length_in_x: 15.0
length_in_y: 15.0
resolution: 0.2

# Input sources
input_sources:
  lidar:
    type: pointcloud                # type supported: pointcloud
    topic: /$(arg prefix)$(arg lidar_topic)   # point cloud topic
    queue_size: 1
    publish_on_update: true
    sensor_processor:
      type: perfect          # oppure laser, depth_image, ecc.
      ignore_points_above: 5.0
      ignore_points_below: -1.0

# Pose cache (pose topic at ~10Hz in your bag)
robot_pose_cache_size: 200

# Update & publish rates
min_update_rate: 2.0
fused_map_publishing_rate: 1.0
relocate_rate: 3.0

# Visibility cleanup
enable_visibility_cleanup: true
visibility_cleanup_rate: 1.0
enable_continuous_cleanup: false

# Variance filtering (optional)
min_variance: 1e-5
max_variance: 0.01