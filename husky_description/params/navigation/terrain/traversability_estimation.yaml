# traversability_estimation.yaml (leggedrobotics)

use_raw_map: false
update_rate: 4.0

map_center_x: 0.0
map_center_y: 0.0
map_length_x: 60.0
map_length_y: 60.0

max_gap_width: 0.3
footprint_yaw: 1.5708

footprint:
  footprint_polygon: [[0.5, 0.32], [0.5, -0.32], [-0.5, -0.32], [-0.5, 0.32]]

  # questi 3 il codice li cerca sotto footprint/
  traversability_default: 0.5
  verify_roughness_footprint: false
  check_robot_inclination: false

# filter chain: deve essere una LISTA (array). Vuota va bene.
traversability_map_filters: []

