# ===========================
# Global & Local Planners
# ===========================

# ----- navfn/NavfnROS -----
NavfnROS:
  visualize_potential: false
  allow_unknown: true
  default_tolerance: 0.1
  prune_plan: true

# ----- global_planner/GlobalPlanner -----
GlobalPlanner:
  visualize_potential: false
  allow_unknown: true
  default_tolerance: 0.1
  use_dijkstra: true
  use_grid_path: false
  old_navfn_behavior: false
  prune_plan: true

# ----- teb_local_planner/TebLocalPlannerROS -----
TebLocalPlannerROS:
  # Frames / topics
  odom_topic: $(arg prefix)odom            # use the ODOM TOPIC, not the frame
  map_frame:  $(arg prefix)$(arg global_frame)

  # Trajectory density / horizon
  teb_autosize: true
  dt_ref: 0.12
  dt_hysteresis: 0.03
  min_samples: 12
  max_global_plan_lookahead_dist: 2.0
  global_plan_overwrite_orientation: true
  global_plan_viapoint_sep: 0.6
  force_reinit_new_goal_dist: 1.0
  feasibility_check_no_poses: 4
  publish_feedback: false
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 3.0
  exact_arc_length: true
  allow_init_with_backwards_motion: true

  # Robot (Husky diffdrive)
  max_vel_x: 0.5
  max_vel_x_backwards: 0.3
  max_vel_theta: 1.2
  max_vel_y: 0.0
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.5
  min_turning_radius: 0.0
  wheelbase: 0.0
  cmd_angle_instead_rotvel: false

  # Footprint (Husky + safety margin)
  footprint_model:
    type: "polygon"
    vertices: [[0.55, 0.40], [0.55, -0.40], [-0.55, -0.40], [-0.55, 0.40]]

  # Goal tolerance / behavior near goal
  xy_goal_tolerance: 0.30
  yaw_goal_tolerance: 0.25
  free_goal_vel: true
  weight_kinematics_forward_drive: 30   # strong bias to forward motion

  # Obstacles & clearance
  include_costmap_obstacles: true
  include_dynamic_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 20
  min_obstacle_dist: 0.60               # keep <= (inflation_radius - footprint_padding)
  inflation_dist: 0.90
  legacy_obstacle_association: true
  obstacle_association_force_inclusion_factor: 2.5
  obstacle_association_cutoff_factor: 3.0
  costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  # Optimization
  no_inner_iterations: 6
  no_outer_iterations: 5
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.1
  weight_max_vel_x: 10
  weight_max_vel_y: 0
  weight_max_vel_theta: 8
  weight_acc_lim_x: 1
  weight_acc_lim_y: 0
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 30
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 10
  weight_obstacle: 70
  weight_inflation: 1
  weight_viapoint: 30
  weight_adapt_factor: 2

  # Homotopy (off for corridor-like nav)
  enable_homotopy_class_planning: false
  simple_exploration: false
  enable_multithreading: true
  max_number_classes: 1
  selection_cost_hysteresis: 1.0
  selection_obst_cost_scale: 4.0
  selection_viapoint_cost_scale: 1.0
  selection_alternative_time_cost: false
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5
  h_signature_prescaler: 1.0
  h_signature_threshold: 0.1
  obstacle_heading_threshold: 0.45
  obstacle_keypoint_offset: 0.1
  visualize_hc_graph: false
