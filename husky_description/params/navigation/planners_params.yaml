# **************************** Global planners ****************************

# ----- navfn/NavfnROS -----
NavfnROS:
  visualize_potential: false
  allow_unknown: true # Specifies whether or not to allow navfn to create plans that traverse unknown space.
  default_tolerance: 0.1 # A tolerance on the goal point for the planner.

# ----- global_planner/GlobalPlanner -----
GlobalPlanner:
  visualize_potential: false
  allow_unknown: true # Specifies whether or not to allow navfn to create plans that traverse unknown space.
  default_tolerance: 0.1 # A tolerance on the goal point for the planner.

# ----- wolf_3dnav_planner/Wolf3DNavPlanner -----
Wolf3DNavPlanner:
  fixed_frame: $(arg prefix)$(arg global_frame)
  occupancy_map_resolution: 0.3
  sta_threshold: 1
  debug_output: false
  truncation_distance: 0.5
  robot_height: 0.3
  step_height: 0.3
  slope_filter_angle: $(arg max_slope)
  footprint_radius: 0.3
  enable_slope_filter: false
  enable_esdf: false
  enable_zcost: false
  enable_roughness: false
  globalcloud_topic: /$(arg prefix)map_3d

# **************************** Local planners ****************************

# ----- teb_local_planner/TebLocalPlannerROS -----
TebLocalPlannerROS:
  odom_topic: $(arg prefix)$(arg odom_frame)
  map_frame: $(arg prefix)$(arg global_frame)

  # Trajectory
  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  min_samples: 3
  global_plan_viapoint_sep: -1
  max_global_plan_lookahead_dist: 7.0
  global_plan_overwrite_orientation: false
  force_reinit_new_goal_dist: 1.0
  feasibility_check_no_poses: 4
  publish_feedback: false
  shrink_horizon_backup: true
  allow_init_with_backwards_motion: false
  exact_arc_length: false
  shrink_horizon_min_duration: 10

  # Robot (Adjusted for Husky)
  max_vel_x: 1.0              # Max forward velocity in m/s (Husky default ~1.0 m/s)
  max_vel_x_backwards: 0.8    # Husky is not intended to drive fast backwards
  max_vel_theta: 1.7          # Max angular velocity in rad/s
  max_vel_y: 0.0              # Differential drive cannot strafe
  acc_lim_x: 1.0              # Husky's linear acceleration limit
  acc_lim_y: 0.0              # No lateral acceleration
  acc_lim_theta: 3.0          # Angular acceleration

  min_turning_radius: 0.0     # 0 for differential drive
  wheelbase: 0.0              # Also 0 for differential drive
  cmd_angle_instead_rotvel: false

  # Footprint (Husky dimensions ~0.98m x 0.67m; use conservative safety margin)
  footprint_model:
    type: "polygon"
    vertices: [ [0.55, 0.4], [0.55, -0.4], [-0.55, -0.4], [-0.55, 0.4] ]

  # GoalTolerance
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.1
  free_goal_vel: false

  # Obstacles
  min_obstacle_dist: 0.35
  include_costmap_obstacles: true
  include_dynamic_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 30
  inflation_dist: 0.6
  legacy_obstacle_association: false
  obstacle_association_force_inclusion_factor: 1.5
  obstacle_association_cutoff_factor: 5.0
  costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  # Optimization
  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.1
  weight_max_vel_x: 20
  weight_max_vel_y: 0       # no lateral movement
  weight_max_vel_theta: 20
  weight_acc_lim_x: 1
  weight_acc_lim_y: 0
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 10
  weight_kinematics_forward_drive: 1
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 20
  weight_obstacle: 50
  weight_inflation: 1
  weight_viapoint: 100
  weight_adapt_factor: 2

  # Homotopy Class Planner
  enable_homotopy_class_planning: false  # usually not needed for Husky
  simple_exploration: false
  enable_multithreading: true
  max_number_classes: 1
  selection_cost_hysteresis: 1.0
  selection_obst_cost_scale: 4.0
  selection_viapoint_cost_scale: 1.0
  selection_alternative_time_cost: false
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5
  h_signature_prescaler: 1.0
  h_signature_threshold: 0.1
  obstacle_heading_threshold: 0.45
  obstacle_keypoint_offset: 0.1
  visualize_hc_graph: false
