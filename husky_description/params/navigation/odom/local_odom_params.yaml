# ------------------------------
# LOCAL UKF (robot_localization)
# Stable 2D planar odom -> base_link
# ------------------------------

frequency: 50.0                # 100Hz spesso è inutile e può amplificare instabilità numeriche
sensor_timeout: 0.5            # più tollerante a piccoli buchi (Gazebo/VO)
two_d_mode: true
publish_tf: true
transform_time_offset: 0.05
print_diagnostics: true

# Frame handling (se non già settati nel launch)
# map_frame: map
# odom_frame: odom
# base_link_frame: base_link
# world_frame: odom

# UKF settings (più robusti)
filter_type: ukf
predict_to_current_time: true
reset_on_time_jump: true        # IMPORTANT in /use_sim_time
history_length: 1.0            # buffer interno per misure asincrone
smooth_lagged_data: true
dynamic_process_noise_covariance: true

# ------------------------------
# IMU
# ------------------------------
# Usa SOLO orientazione + velocità angolari. NIENTE accelerazioni lineari (spesso causa #1 dei NaN).
imu0_config: [false, false, false,   # x, y, z
              true,  true,  true,    # roll, pitch, yaw
              false, false, false,   # vx, vy, vz
              true,  true,  true,    # vroll, vpitch, vyaw
              false, false, false]   # ax, ay, az  <-- OFF
imu0_differential: false
imu0_relative: false
imu0_nodelay: true
imu0_queue_size: 50
imu0_remove_gravitational_acceleration: true

# Se il tuo IMU orientation è già filtrato bene, ok.
# Se invece “salta”, prova a mettere imu0_differential: true e disabilitare l'orientazione (solo gyro),
# ma come baseline questo è più semplice.

# ------------------------------
# ROBOT ODOMETRY (wheel / robot odom)
# ------------------------------
# Consiglio: in 2D usa yaw e (meglio) velocità, non solo posa differenziale.
# Se la tua /odometry/robot ha twist affidabile, abilita vx/vy/vyaw invece della posa in differential.
odom0_config: [true,  true,  false,  # x, y, z
               false, false, true,   # roll, pitch, yaw
               true,  true,  false,  # vx, vy, vz     <-- ON (se disponibile)
               false, false, true,   # vroll, vpitch, vyaw  <-- ON (vyaw)
               false, false, false]  # ax, ay, az
odom0_differential: false            # IMPORTANT: togliamo differential per evitare "salti" -> NaN
odom0_relative: false
odom0_nodelay: true
odom0_queue_size: 20

# Se il tuo odom0 NON pubblica twist buono, torna a:
# odom0_config: [true,true,false,  false,false,true,  false,false,false,  false,false,false,  false,false,false]
# odom0_differential: true
# ma questa è più fragile se l'odom resetta o ha glitch.

# ------------------------------
# VISUAL ODOMETRY (VO)
# ------------------------------
# Stessa filosofia: usa twist se disponibile, altrimenti posa.
odom1_config: [true,  true,  false,
               false, false, true,
               true,  true,  false,
               false, false, true,
               false, false, false]
odom1_differential: false
odom1_relative: false
odom1_nodelay: true
odom1_queue_size: 20

# ------------------------------
# Covarianze (più “condizionate”)
# ------------------------------
