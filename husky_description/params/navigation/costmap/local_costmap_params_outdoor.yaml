local_costmap:
  global_frame: $(arg prefix)$(arg odom_frame)   # consigliato outdoor per evitare salti con map frame generato da gps
  rolling_window: true
  width: 60.0
  height: 60.0
  resolution: 0.10

  plugins:
    # - name: traversability_layer
    #   type: "wolf_navigation/TraversabilityLayer"
    - name: voxel_layer
      type: "costmap_2d::VoxelLayer"
    - name: obstacle_layer
      type: "costmap_2d::ObstacleLayer"
    - name: inflation_layer
      type: "costmap_2d::InflationLayer"

  traversability_layer:
    enabled: true
    grid_map_topic: "/$(arg prefix)traversability_map"
    traversability_layer_name: "traversability"
    unknown_cost: 200
    lethal_threshold: 0.95
    scale_to_cost: true

  obstacle_layer:
    enabled: false
    obstacle_range: 8.0
    raytrace_range: 10.0
    track_unknown_space: true
    footprint_clearing_enabled: true
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      sensor_frame: $(arg prefix)$(arg stabilized_frame)
      data_type: LaserScan
      topic: $(arg prefix)$(arg scan_topic)
      marking: true
      clearing: true
      inf_is_valid: true

  voxel_layer:
    enabled: true
    origin_z: 0.0
    z_resolution: 0.15
    z_voxels: 16
    min_obstacle_height: 0.20
    max_obstacle_height: 3.0
    observation_sources: lidar_sensor
    lidar_sensor:
      data_type: PointCloud2
      topic: $(arg prefix)$(arg lidar_topic)   # <-- RAW, no _filtered
      sensor_frame: $(arg prefix)$(arg stabilized_frame)
      marking: true
      clearing: true
      obstacle_range: 12.0
      raytrace_range: 15.0
      track_unknown_space: true

  inflation_layer:
    inflation_radius: 0.6
