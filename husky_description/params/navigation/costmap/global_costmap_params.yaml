global_costmap:
  global_frame: $(arg prefix)$(arg global_frame)
  rolling_window: false
  resolution: 0.05

  inflation_layer:
    inflation_radius: 0.75
    #cost_scaling_factor: 2.58

  static_layer:
    map_topic: $(arg prefix)map
    subscribe_to_updates: true
    track_unknown_space: true

  traversability_layer:
    enabled: $(arg enable_traversability_layer)
    map_topic: "/$(arg prefix)traversability_costmap"
    subscribe_to_updates: false
    track_unknown_space: false
    use_maximum: true
    lethal_cost_threshold: 95   # sopra 95 => lethal (100)
    trinary_costmap: false      # lascia costi intermedi (meglio per TEB)

  obstacle_layer:
    enabled: $(arg enable_obstacle_layer)
    obstacle_range: 12.0
    raytrace_range: 15.0
    track_unknown_space: true # true needed for disabling global path planning through unknown space
    footprint_clearing_enabled: true
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      sensor_frame: $(arg prefix)$(arg stabilized_frame)
      data_type: LaserScan
      topic: $(arg prefix)$(arg scan_topic)
      marking: true
      clearing: true
      inf_is_valid: true
      min_obstacle_height: $(arg min_obs_height)
      max_obstacle_height: $(arg max_obs_height)

  plugins:
    - name: static_layer
      type: "costmap_2d::StaticLayer"
    - name: traversability_layer
      type: "costmap_2d::StaticLayer"
    - name: obstacle_layer
      type: "costmap_2d::ObstacleLayer"
    - name: inflation_layer
      type: "costmap_2d::InflationLayer"
