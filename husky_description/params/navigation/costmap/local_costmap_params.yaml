local_costmap:
  global_frame: $(arg prefix)$(arg global_frame)
  rolling_window: true
  width: 50.0
  height: 50.0
  resolution: 0.05 # To set based on the laserscan resolution

  plugins:
    - name: traversability_layer
      type: "costmap_2d::StaticLayer"
    - name: voxel_layer
      type: "costmap_2d::VoxelLayer"
    - name: obstacle_layer
      type: "costmap_2d::ObstacleLayer"
    - name: inflation_layer
      type: "costmap_2d::InflationLayer"

  traversability_layer:
    enabled: $(arg enable_traversability_layer)
    map_topic: "/$(arg prefix)traversability_costmap"
    subscribe_to_updates: false
    track_unknown_space: false
    use_maximum: true
    lethal_cost_threshold: 95   # above 95 => lethal (100)
    trinary_costmap: false    # better for the local planner

  voxel_layer:
    enabled: $(arg enable_voxel_layer)
    origin_z: 0.0
    z_resolution: 0.1
    z_voxels: 10
    #unknown_threshold: 0
    #mark_threshold: 3
    #publish_voxel_map: true
    #NOTE: in order to have the clearing enabled z_voxels > max_obstacle_height/z_resolution
    min_obstacle_height: $(arg min_obs_height)
    max_obstacle_height: $(arg max_obs_height)
    #combination_method: 1
    observation_sources: lidar_sensor
    lidar_sensor:
      data_type: PointCloud2
      topic:  $(arg prefix)$(arg lidar_topic)_filtered
      sensor_frame: $(arg prefix)$(arg stabilized_frame)
      marking: true
      clearing: true
      inf_is_valid: true
      obstacle_range: 12.0
      raytrace_range: 15.0
      track_unknown_space: true # true needed for disabling global path planning through unknown space

  obstacle_layer:
    enabled: $(arg enable_obstacle_layer)
    obstacle_range: 12.0
    raytrace_range: 15.0
    track_unknown_space: true # true needed for disabling global path planning through unknown space
    footprint_clearing_enabled: true
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      sensor_frame: $(arg prefix)$(arg stabilized_frame)
      data_type: LaserScan
      topic: $(arg prefix)$(arg scan_topic)
      marking: true
      clearing: true
      inf_is_valid: true
      min_obstacle_height: $(arg min_obs_height)
      max_obstacle_height: $(arg max_obs_height)
      #observation_persistence: 1.0

  inflation_layer:
    inflation_radius: 0.75
    #cost_scaling_factor: 2.58