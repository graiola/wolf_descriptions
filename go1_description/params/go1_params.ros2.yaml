/${TF_PREFIX}/controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    
    wolf_controller:
      type: wolf_controller/WolfController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/${TF_PREFIX}/wolf_controller:
  ros__parameters:
    input_device: ${INPUT_DEVICE}
    imu_sensor_name: ${TF_PREFIX}_imu
    period: ${PERIOD}
    default_duty_factor: 0.2
    default_swing_frequency: 5.0
    default_contact_threshold: 15.0
    default_base_linear_velocity_x: ${MAX_VEL_X}
    default_base_linear_velocity_y: ${MAX_VEL_Y}
    default_base_linear_velocity_z: ${MAX_VEL_Z}
    default_base_angular_velocity:  ${MAX_VEL_YAW}
    default_step_height: 0.07
    default_push_recovery_sensibility: 0.5
    max_step_height: 0.25
    max_step_length: 0.5
    max_base_height: 0.35
    max_base_roll: 0.523
    min_base_roll: -0.523
    max_base_pitch: 0.523
    min_base_pitch: -0.523
    estimation_position_type: kalman_filter
    estimation_orientation_type: imu_magnetometer
    activate_step_reflex: true
    activate_push_recovery: true
    publish_odom_msg: ${PUBLISH_ODOM_MSG}
    publish_odom_tf: ${PUBLISH_ODOM_TF}
    odom_topic: odometry/robot
    tf_prefix: ${TF_PREFIX}
    use_contact_sensors: false
    min_forces_weight: 0.01
    min_qddot_weight: 0.1
    gains:
        Kp_leg: {haa: 100.0, hfe: 100.0, kfe: 1.0}
        Kd_leg: {haa: 1.0, hfe: 1.0, kfe: 0.1}
        lf_foot:
            Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            weight: 100.0
        rf_foot:
            Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            weight: 100.0
        rh_foot:
            Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            weight: 100.0
        lh_foot:
            Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
            weight: 100.0
        waist:
            Kp: {x: 0.0, y: 0.0, z: 0.0, roll: 100.0, pitch: 100.0, yaw: 10.0}
            Kd: {x: 0.0, y: 0.0, z: 0.0, roll: 20.0, pitch: 20.0, yaw: 6.0}
            weight: 1.0
        CoM:
            Kp: {x: 100.0, y: 100.0, z: 100.0}
            Kd: {x: 20.0, y: 20.0, z: 20.0}
            weight: 1.0
        angular_momentum:
            weight: 0.1
        postural:
          weight: 0.00001
