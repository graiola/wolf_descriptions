wolf_controller:
  type: wolf_controller/WolfController
  default_duty_factor: 0.2
  default_swing_frequency: 5.0
  default_contact_threshold: 15.0
  default_base_linear_velocity_x: $(arg max_vel_x)
  default_base_linear_velocity_y: $(arg max_vel_y)
  default_base_linear_velocity_z: $(arg max_vel_z)
  default_base_angular_velocity:  $(arg max_vel_yaw)
  default_step_height: 0.07
  default_push_recovery_sensibility: 0.5
  max_step_height: 0.25
  max_step_length: 0.5
  max_base_height: 0.35
  max_base_roll: 0.523
  min_base_roll: -0.523
  max_base_pitch: 0.523
  min_base_pitch: -0.523
  estimation_position_type: ground_truth
  estimation_orientation_type: ground_truth
  activate_step_reflex: true
  activate_push_recovery: true
  publish_odom_msg: $(arg publish_odom_msg)
  publish_odom_tf: $(arg publish_odom_tf)
  use_contact_sensors: false
  use_effort_command_for_estimation: false
  min_forces_weight: 0.0
  min_qddot_weight: 0.0

  gains:
      Kp_leg: {haa: 100.0, hfe: 100.0, kfe: 1.0}
      Kd_leg: {haa: 1.0, hfe: 1.0, kfe: 0.1}

      lf_foot:
          Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          weight: 100.0
      rf_foot:
          Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          weight: 100.0
      rh_foot:
          Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          weight: 100.0
      lh_foot:
          Kp: {x: 1000.0, y: 1000.0, z: 1000.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          Kd: {x: 63.0, y: 63.0, z: 63.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
          weight: 100.0

      waist:
          Kp: {x: 0.0, y: 0.0, z: 0.0, roll: 100.0, pitch: 100.0, yaw: 10.0}
          Kd: {x: 0.0, y: 0.0, z: 0.0, roll: 20.0, pitch: 20.0, yaw: 6.0}
          weight: 50.0

      lf_foot_wrench:
          weight: 2.0
      rf_foot_wrench:
          weight: 2.0
      rh_foot_wrench:
          weight: 2.0
      lh_foot_wrench:
          weight: 2.0
  
      com:
          Kp: {x: 100.0, y: 100.0, z: 100.0}
          Kd: {x: 20.0, y: 20.0, z: 20.0}
          weight: 100.0

      angular_momentum:
          weight: 0.1

      postural:
          weight: 0.00001
